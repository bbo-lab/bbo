# This is an ongoing attempt for a standard enviroment for bbo software
# Windows version

name: bbo_windows
channels:
  - conda-forge
dependencies:
  - python=3.12
  - ipython
  - ipykernel
  - matplotlib  # Brings pyside6
  # - pyside6  # Should come with matplotlib
  - pip:
      - bbo-bbo
      - bbo-calibcamlib
      - bbo-ccvtools
      - bbo-svidreader
#      - cupy-cuda12x  # Didn't get conda variant running
      - cupy-cuda12x[ctk]  # Dows not require CUDA Toolkit, with CUDA, remove ctk
      - pandas
      - mpmath
      - pyyaml
      - scipy
      - opencv-python-headless  # conda version brings incompatible qt

