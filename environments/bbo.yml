# This is an ongoing attempt for a standard enviroment for bbo software
# Windows version

name: bbo
channels:
  - conda-forge
dependencies:
  - python=3.12
  - ipython
  - ipykernel
  - matplotlib  # Brings pyside6
  # - pyside6  # Should come with matplotlib
  - ipympl
  - numpy
  - scipy
  - jupyterlab
  - pyqtgraph
  - pip:
      - bbo-bbo
      - bbo-calibcamlib
      - bbo-ccvtools
      - bbo-svidreader
      - pandas
      - mpmath
      - pyyaml
      - scipy
      - opencv-python-headless  # conda version brings incompatible qt
      # - cupy-cuda12x[ctk]  # Does not require CUDA Toolkit, with CUDA, remove ctk
      - cupy  # TODO: Check if conda version is better choice
