# This is an ongoing attempt for a standard enviroment for bbo software
# Windows version

name: bbo
channels:
  - conda-forge
dependencies:
  - python=3.12
  - ipython
  - ipykernel<7  # I experienced weird matplotlib issues with 7 ~Kay 20260827
  - matplotlib  # Brings pyside6
  - pyside6  # Should come with matplotlib anyway
  - ipympl
  - numpy
  - scipy
  - cupy  # On Linux, this installs the required cuda packages, too. TODO: Check Windows
  - jupyterlab
  - pyqtgraph
  - pip:
      - bbo-bbo
      - bbo-calibcamlib
      - bbo-ccvtools
      - bbo-svidreader
      - pandas
      - mpmath
      - pyyaml
      - scipy
      - opencv-python-headless  # conda version brings incompatible qt
      # - cupy-cuda12x[ctk]  # Does not require CUDA Toolkit, with CUDA, remove ctk
